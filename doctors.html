                    "image": "images/doctor-male.webp"
                },
            ]
        };

        function displayDoctors() {
            const container = document.getElementById('doctorsContainer');
            
            doctorsData.doctors.forEach(doctor => {
                const doctorCard = document.createElement('div');
                doctorCard.className = 'doctor-card';
                
                doctorCard.innerHTML = `
                    <img src="${doctor.image}" alt="${doctor.name}" class="doctor-img">
                    <h3>${doctor.name}</h3>
                    <p><strong>التخصص:</strong> ${doctor.specialization}</p>
                    <p><strong>الخبرة:</strong> ${doctor.experience}</p>
                    <p>${doctor.description}</p>
                `;
                
                container.appendChild(doctorCard);
            });
        }
        
        window.onload = displayDoctors;
    </script>
