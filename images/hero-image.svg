<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 520" role="img" aria-label="Al-Shifa Hospital">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1e3a8a"/><stop offset="1" stop-color="#0f172a"/></linearGradient>
    <linearGradient id="bld" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f8fafc"/><stop offset="1" stop-color="#cbd5e1"/></linearGradient>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#60a5fa"/><stop offset="1" stop-color="#2563eb"/></linearGradient>
    <radialGradient id="glow" cx=".5" cy=".4" r=".6"><stop offset="0" stop-color="#3b82f6" stop-opacity=".45"/><stop offset="1" stop-color="#3b82f6" stop-opacity="0"/></radialGradient>
  </defs>
  <style>
    .beat { stroke-dasharray: 900; stroke-dashoffset: 900; animation: beat 3.2s linear infinite; }
    @keyframes beat { to { stroke-dashoffset: -900; } }
    .float { animation: float 5s ease-in-out infinite; }
    @keyframes float { 50% { transform: translateY(-8px); } }
    .pulse { animation: pulse 2.4s ease-in-out infinite; transform-origin: 350px 150px; }
    @keyframes pulse { 50% { transform: scale(1.06); } }
  </style>
  <rect width="700" height="520" fill="url(#sky)"/>
  <circle cx="350" cy="200" r="260" fill="url(#glow)"/>
  <g fill="#ffffff" opacity=".5"><circle cx="90" cy="70" r="1.6"/><circle cx="610" cy="60" r="1.4"/><circle cx="520" cy="120" r="1.2"/><circle cx="160" cy="140" r="1.1"/><circle cx="640" cy="200" r="1.3"/><circle cx="60" cy="230" r="1.2"/></g>

  <!-- building -->
  <g class="float">
    <rect x="170" y="210" width="360" height="250" rx="14" fill="url(#bld)"/>
    <rect x="270" y="170" width="160" height="60" rx="10" fill="#e2e8f0"/>
    <g fill="#93c5fd">
      <rect x="200" y="250" width="44" height="34" rx="6"/><rect x="262" y="250" width="44" height="34" rx="6"/>
      <rect x="394" y="250" width="44" height="34" rx="6"/><rect x="456" y="250" width="44" height="34" rx="6"/>
      <rect x="200" y="304" width="44" height="34" rx="6"/><rect x="262" y="304" width="44" height="34" rx="6"/>
      <rect x="394" y="304" width="44" height="34" rx="6"/><rect x="456" y="304" width="44" height="34" rx="6"/>
      <rect x="200" y="358" width="44" height="34" rx="6"/><rect x="456" y="358" width="44" height="34" rx="6"/>
    </g>
    <rect x="318" y="360" width="64" height="100" rx="8" fill="#1e40af"/>
    <rect x="348" y="360" width="4" height="100" fill="#93c5fd"/>
    <!-- cross -->
    <g class="pulse">
      <circle cx="350" cy="150" r="54" fill="url(#acc)"/>
      <rect x="338" y="118" width="24" height="64" rx="5" fill="#fff"/>
      <rect x="318" y="138" width="64" height="24" rx="5" fill="#fff"/>
    </g>
  </g>

  <!-- ground + heartbeat -->
  <rect x="0" y="460" width="700" height="60" fill="#0b1220"/>
  <path class="beat" d="M0 490 H210 l18 -34 l22 62 l20 -80 l18 52 H700" fill="none" stroke="#34d399" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
