<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل الدخول - مستشفى الشفاء</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- شريط التنقل -->
  <nav class="navbar">
    <div class="container nav-container">
      <a href="index.html" class="logo">
        <i class="fas fa-hospital-alt"></i>
        <span>مستشفى الشفاء</span>
      </a>
      
      <div class="nav-links">
        <a href="index.html" class="nav-link">الرئيسية</a>
        <a href="doctors.html" class="nav-link">الأطباء</a>
        <a href="services.html" class="nav-link">الخدمات</a>
        <a href="news.html" class="nav-link">الأخبار</a>
        <a href="login.html" class="nav-link active">تسجيل الدخول</a>
      </div>
    </div>
    
  </nav>

  <!-- محتوى الصفحة -->
  <main class="container">
    <div class="auth-form">
      <h2 class="text-center" style="margin-bottom: 2rem;">تسجيل الدخول</h2>
      
      <form id="loginForm">
        <div class="form-group">
          <label for="email" class="form-label">البريد الإلكتروني</label>
          <input type="email" id="email" class="form-input" placeholder="أدخل بريدك الإلكتروني" required>
          <span id="emailError" class="form-error"></span>
        </div>
        
        <div class="form-group">
          <label for="password" class="form-label">كلمة المرور</label>
          <input type="password" id="password" class="form-input" placeholder="أدخل كلمة المرور" required>
          <span id="passwordError" class="form-error"></span>
        </div>
        
        <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">
          تسجيل الدخول
        </button>
      </form>
      
      <div style="text-align: center; margin-top: 1.5rem;">
        <p>ليس لديك حساب؟ <a href="register.html" style="color: var(--dark-accent);">إنشاء حساب جديد</a></p>
      </div>
    </div>
  </main>

  <!-- زر تبديل الوضع -->
  <button class="theme-toggle" id="themeToggle">
    <i class="fas fa-moon"></i>
  </button>

  <!-- JavaScript -->
  <script src="js/auth.js"></script>
  <script src="js/theme.js"></script>
</body>
</html>
